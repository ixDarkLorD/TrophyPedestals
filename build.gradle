plugins {
    alias libs.plugins.architectury.loom.noremap apply false
    alias libs.plugins.architectury.plugin apply false
    alias libs.plugins.shadow apply false
    alias libs.plugins.modpublisher apply false
}

// Every project's Java, jar, resource and publishing setup.
apply from: "${findProperty("shared_scripts_url") ?: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4"}/main.gradle"

subprojects {
    // Every jar carries the mod's license (MPL-2.0).
    tasks.withType(Jar).configureEach {
        from(rootProject.file("LICENSE"))
    }

    // FTB Quests and Library (an optional integration) are published only to FTB's own Maven.
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = "FTB"
                    url = "https://maven.ftb.dev/releases"
                }
            }
            filter {
                includeGroup "dev.ftb.mods"
            }
        }
    }
}
