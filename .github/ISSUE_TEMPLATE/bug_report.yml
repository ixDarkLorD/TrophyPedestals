name: Bug Report
description: Something in Trophy Pedestals doesn't work, looks wrong or crashes.
labels: [ "bug" ]
assignees:
  - ixDarkLorD
body:
  - type: markdown
    attributes:
      value: |
        **Thank you for taking the time to report this!** Every report helps make Trophy Pedestals better.
        Questions about configs, data packs or scripts are answered faster in the [docs](https://ixdarklord.github.io/TrophyPedestals/docs/) or on [Discord](https://discord.gg/ZapGEPqm2V).
  - type: checkboxes
    attributes:
      label: Before you start
      options:
        - label: I searched the [open and closed issues](https://github.com/ixDarkLorD/TrophyPedestals/issues?q=is%3Aissue) and this hasn't been reported yet.
          required: true
        - label: I'm using the latest Trophy Pedestals and CoolCatLib for my Minecraft version, or I've said below why I can't.
          required: true
  - type: textarea
    attributes:
      label: What happens
      description: What goes wrong? Include any error message you see in game.
      placeholder: "Example: Closing a glass case over a pedestal shows a dark box instead of the item inside."
    validations:
      required: true
  - type: textarea
    attributes:
      label: What should happen
      description: What you expected to see instead.
      placeholder: "Example: The item stays visible through the glass."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The shortest way to make it happen. If it only happens with one mob, item or pedestal, say which.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Where it happens
      description: Pick every place you've seen it.
      multiple: true
      options:
        - Pedestals and displayed items
        - Mob trophies (drops, ranks, looks)
        - Trophy effects (light, beam, halos, flares, particles, sounds)
        - Trophy cabinets and shelves
        - Glass cases and mannequins
        - Leaderboard pedestals
        - Mob Trophies Ledger and collecting
        - Earned trophies (bosses, milestones, advancements)
        - Adjust and settings screens
        - Items in inventories, JEI, REI or the creative tabs
        - Config, data packs or commands
        - Multiplayer or servers
        - Another mod (Jade, The One Probe, FTB Quests, KubeJS, KubeGroovy...)
        - Not sure
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Minecraft version
      options:
        - "26.3"
        - "26.2"
        - "26.1.2"
        - "1.21.1"
        - "1.20.1"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Mod loader
      description: 26.x and 1.21.1 run on Fabric and NeoForge, 1.20.1 on Fabric and Forge.
      options:
        - Fabric
        - NeoForge
        - Forge
    validations:
      required: true
  - type: input
    attributes:
      label: Trophy Pedestals and CoolCatLib versions
      description: Shown in the mod list, or in the jar names.
      placeholder: "Trophy Pedestals 0.3.0, CoolCatLib 9.0.0"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Other mods and shaders
      description: Mods that change rendering matter most (Iris, Sodium, Embeddium, OptiFine), and mods that add mobs if it's about a mob trophy, plus the shader pack if one is on. A modpack name and version works too.
      placeholder: "Iris 1.11.7, Sodium 0.9.2, BSL v10.1.8"
    validations:
      required: false
  - type: textarea
    attributes:
      label: Config or data pack
      description: If you changed settings or wrote a data pack, paste what relates to the problem (the lines from trophypedestals-server.toml, a feat, a tag or a loot table).
      render: text
    validations:
      required: false
  - type: input
    attributes:
      label: Log or crash report
      description: A **link** to `logs/latest.log` or the crash report, uploaded to [mclo.gs](https://mclo.gs) or a Gist. Please don't paste the whole log here.
      placeholder: "https://mclo.gs/..."
    validations:
      required: false
  - type: textarea
    attributes:
      label: Screenshots or videos
      description: Drag images or clips here. For anything visual, a screenshot helps the most.
    validations:
      required: false
  - type: input
    attributes:
      label: Operating system and GPU
      description: Only needed for rendering problems.
      placeholder: "Windows 11, NVIDIA RTX 3060"
    validations:
      required: false
