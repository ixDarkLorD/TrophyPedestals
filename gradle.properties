# ─── Gradle ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# Minecraft decompilation needs the memory; the daemon and build cache keep repeated builds fast.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── Build ──────────────────────────────────────────────────────────────────────────────────────────────────────────
# The shared version catalog (net.ixdarklord:sharedcatalogs) and the loaders this version is built for.
dependencies_catalog_version=1.21.1-v10
project_loaders=fabric,neoforge
project_game_versions=1.21.1
# The oldest versions the jars accept (the metadata templates read them).
supported_min_mc_version=1.21.1
supported_min_neoforge_version=21.1.200
supported_min_fabric_api_version=0.116.5

# ─── Dev Runs ───────────────────────────────────────────────────────────────────────────────────────────────────────
runtime_min_ram=1G
runtime_max_ram=4G
mixin_debug=false

# ─── Mod ────────────────────────────────────────────────────────────────────────────────────────────────────────────
mod_version=0.1.0
modid=trophypedestals
mod_maven_name=trophypedestals
mod_name=Trophy Pedestals
mod_description=Pedestals to show off what you've done: display pedestals for any item, mob trophies that keep the mob's look, player statues, and trophy cabinets and shelves.
mod_author=ixDarkLorD
# Not chosen yet; MPL-2.0 matches CoolCatLib and most of the author's mods.
mod_license=MPL-2.0
mod_maven_group=net.ixdarklord
mod_source_url=https://github.com/ixDarkLorD/TrophyPedestals
mod_issue_url=https://github.com/ixDarkLorD/TrophyPedestals/issues
mod_page_url=https://modrinth.com/mod/trophypedestals
mod_forge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/forge/trophypedestals.json
mod_neoforge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/neoforge/trophypedestals.json
mod_fabric_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/fabric/trophypedestals.json
# "*" for a mod loaded on both sides, "server" for a server only mod, "client" for a client only mod
mod_environment=*
# (Forge) "MATCH_VERSION" for both sides, "IGNORE_SERVER_VERSION" for server only, "IGNORE_ALL_VERSION" for client only
mod_forge_display_test=MATCH_VERSION

# ─── Publishing ─────────────────────────────────────────────────────────────────────────────────────────────────────
# Projects created (CurseForge new, Modrinth draft), not yet approved: uploads stay in debug mode (nothing is published).
project_release_type=alpha
project_upload_debug=true
copy_build_jar=true
project_curse_id=1787302
project_modrinth_id=7h4XmIig
fabric_publish_dependencies=requirement[coolcatlib,fabric-api],optional[jei]
neoforge_publish_dependencies=requirement[coolcatlib],optional[jei,kubejs]

# ─── Dependencies ───────────────────────────────────────────────────────────────────────────────────────────────────
# CoolCatLib 8.2.0 (unreleased; Maven Local): its LivingEvents.DEATH and its BlockEntityRendererRegistry, which draws the pedestals and cabinets.
coolcatlib_version=8.2.0+1.21.1
coolcatlib_min_version=8.2.0
# JEI comes from the shared catalog (libs.jei).
# Optional KubeJS (NeoForge only, as on 26.x): pedestal bindings for scripts. Compile-only.
kubejs_version=2101.7.2-build.381
rhino_version=2101.2.8-build.91+Rhino-1.21
# Dev runs only, with -Ptest_spark=true: the profiler.
spark_version=1.10.124-neoforge-1.21.1
# Dev runs only (never published): lets tools drive the game from outside.
mcp_bridge_version=1.0.0+1.21.1
