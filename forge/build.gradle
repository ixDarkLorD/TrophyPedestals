apply from: "${rootProject.sharedScripts}/forge.gradle"

dependencies {
    // CoolCatLib (Forge). Its common classes are inside this jar.
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-forge:${coolcatlib_version}") { transitive = false }

    // Dev runs only, never published: MCP Bridge lets the game be driven from outside. Not transitive, because it still points
    // at CoolCatLib's old coordinates and would load a second copy of it.
    modLocalRuntime("net.ixdarklord.mcp_bridge:mcp_bridge-forge:${mcp_bridge_version}") { transitive = false }

    // JEI in a dev run only when asked (-Ptest_jei=true).
    if (project.findProperty("test_jei") == "true") modLocalRuntime libs.jei.forge

    // Optional REI's plugin annotation and The One Probe's API (registered through Forge's inter-mod messages).
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-forge:12.1.785") { transitive = false }
    modCompileOnly("mcjty.theoneprobe:theoneprobe:${top_forge_version}:api") { transitive = false }
    // Optional KubeJS (its API exposes Rhino types): pedestal bindings (forge/compat/kubejs).
    modCompileOnly("maven.modrinth:kubejs:${kubejs_version}") { transitive = false }
    modCompileOnly("maven.modrinth:rhino:${rhino_version}") { transitive = false }
    // REI and Jade in a dev run only when asked (-Ptest_rei=true, -Ptest_jade=true).
    if (project.findProperty("test_rei") == "true") modLocalRuntime libs.rei.forge
    if (project.findProperty("test_jade") == "true") modLocalRuntime("maven.modrinth:jade:${jade_version}+forge") { transitive = false }
}

loom {
    runs {
        // Forge's game test server: runs every registered test and exits. On Forge 47 that's the normal server launch with
        // these two properties (without them a plain server starts and never exits).
        gameTestServer {
            server()
            forgeTemplate("gameTestServer")
            setConfigName("Forge Game Test Server ${libs.versions.minecraft.get()}")
            runDir(helper.runDir("run/gametest"))
            property "forge.gameTestServer", "true"
            property "forge.enableGameTest", "true"
            property "forge.enabledGameTestNamespaces", modid
            // The example data pack the tests load (it isn't in the mod jar).
            property "trophypedestals.testpack", rootProject.file("testpack").absolutePath
        }
    }
}
