apply from: "${rootProject.sharedScripts}/fabric.gradle"

// Fabric API 0.116.5+1.21.1 publishes fabric-loot-api-v2 with dependencies on modules of a newer Minecraft
// (fabric-resource-loader-v0 2.0.0, fabric-api-base 0.4.43), which Gradle then picks over the ones the API itself
// ships, and a dev run then fails to load. Those two are dropped from that module: the API brings its own.
dependencies.components.withModule("net.fabricmc.fabric-api:fabric-loot-api-v2") {
    allVariants {
        withDependencies { deps -> deps.removeAll { it.name in ["fabric-resource-loader-v0", "fabric-api-base"] } }
    }
}

dependencies {
    // CoolCatLib (Fabric). Its common classes are inside this jar.
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-fabric:${coolcatlib_version}") { transitive = false }

    // Dev runs only, never published: MCP Bridge lets the game be driven from outside. Not transitive, because it still points
    // at CoolCatLib's old coordinates and would load a second copy of it.
    modLocalRuntime("net.ixdarklord.mcp_bridge:mcp_bridge-fabric:${mcp_bridge_version}") { transitive = false }

    // JEI in a dev run only when asked (-Ptest_jei=true).
    if (project.findProperty("test_jei") == "true") modLocalRuntime libs.jei.fabric
}

loom {
    runs {
        // A dedicated server that runs every game test and exits (Fabric API's switch, which CoolCatLib honours).
        gameTestServer {
            server()
            setConfigName("Fabric Game Test Server ${libs.versions.minecraft.get()}")
            runDir(helper.runDir("run/gametest"))
            property "fabric-api.gametest"
            // The example data pack the tests load (it isn't in the mod jar).
            property "trophypedestals.testpack", rootProject.file("testpack").absolutePath
        }
    }
}
