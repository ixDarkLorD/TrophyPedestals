apply from: "${rootProject.sharedScripts}/fabric.gradle"

dependencies {
    // CoolCatLib (Fabric). Its common classes are inside this jar.
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-fabric:${coolcatlib_version}") { transitive = false }
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-canvas-fabric:${coolcatlib_version}") { transitive = false }

    // Dev runs only, never published: MCP Bridge lets the game be driven from outside. Not transitive, because it still points
    // at CoolCatLib's old coordinates and would load a second copy of it.
    modLocalRuntime("net.ixdarklord.mcp_bridge:mcp_bridge-fabric:${mcp_bridge_version}") { transitive = false }

    // JEI in a dev run only when asked (-Ptest_jei=true).
    if (project.findProperty("test_jei") == "true") modLocalRuntime libs.jei.fabric
    // REI and Jade in a dev run only when asked (-Ptest_rei=true, -Ptest_jade=true).
    if (project.findProperty("test_rei") == "true") modLocalRuntime libs.rei.fabric
    if (project.findProperty("test_jade") == "true") modLocalRuntime("maven.modrinth:jade:${jade_version}+fabric") { transitive = false }
    // Iris with Sodium, for shader packs, in a dev run only when asked (-Ptest_iris=true).
    if (project.findProperty("test_iris") == "true") {
        modLocalRuntime "maven.modrinth:sodium:${sodium_fabric_version}"
        // Sodium carries this Fabric API module inside its jar, which a dev run doesn't load.
        modLocalRuntime "net.fabricmc.fabric-api:fabric-rendering-data-attachment-v1:0.3.37+92a0d36777"
        modLocalRuntime "maven.modrinth:iris:${iris_fabric_version}"
        // and the libraries Iris carries inside its jar
        localRuntime "org.anarres:jcpp:1.4.14"
        localRuntime "io.github.douira:glsl-transformer:2.0.0-pre13"
        localRuntime "org.antlr:antlr4-runtime:4.11.1"
    }
}

loom {
    runs {
        // A dedicated server that runs every game test and exits (Fabric API's switch, which CoolCatLib honours).
        gameTestServer {
            server()
            setConfigName("Fabric Game Test Server ${libs.versions.minecraft.get()}")
            runDir(helper.runDir("run/gametest"))
            property "fabric-api.gametest"
            // The example data pack the tests load (it isn't in the mod jar).
            property "trophypedestals.testpack", rootProject.file("testpack").absolutePath
        }
    }
}
