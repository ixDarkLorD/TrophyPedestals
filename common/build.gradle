apply from: "${rootProject.sharedScripts}/common.gradle"

dependencies {
    // CoolCatLib (common): mod constructors, events, networking, configs, registries, game tests
    modCompileOnly("net.ixdarklord.coolcatlib:coolcatlib-common:${coolcatlib_version}") { transitive = false }

    // Optional recipe viewer: tells mob trophies apart (compat/jei)
    modCompileOnly libs.jei.api.common
}

// Java 17's javadoc reads the sources as the platform's encoding unless told.
javadoc {
    options.encoding = "UTF-8"
}

// The shared main.gradle publishes every subproject's shadowJar. For common it must be a plain jar of this
// module's own classes (Shadow's default bundles the whole runtime classpath under an "-all" classifier).
shadowJar {
    configurations = []
    archiveClassifier = null
}
